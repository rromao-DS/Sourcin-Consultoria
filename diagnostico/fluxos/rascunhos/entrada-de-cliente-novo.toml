# RASCUNHO A VALIDAR · fluxo atual (AS-IS) de entrada de cliente novo
# Fonte: transcrição da reunião de 12/10/2026, 00:55:16 (checklist do Trello mostrado pela Thamires)
# e 01:22:40 (propostas feitas pela Júlia no Canva).
# Tempos e esperas NÃO foram informados: ficam em branco até a entrevista. Os totais do relatório
# saem zerados por isso, não porque o processo seja rápido.
# Quem faz cada passo antes do fechamento é [HIPÓTESE]; depois do fechamento, "isso quem faz hoje é a Júlia".

raias = ["Thamires", "Júlia", "Cliente"]

[processo]
nome = "Entrada de cliente novo (contabilidade e financeiro) · rascunho"
descricao = """
Do primeiro contato à criação das tarefas no Trello. Checklist já existe no Trello e,
segundo a Thamires, precisa ser atualizado. O cliente do financeiro tem passos a mais:
planilha, Trello e Conta Azul (00:55:16).
"""

[[etapas]]
id = "inicio"
nome = "Cliente chega"
tipo = "inicio"
raia = "Cliente"

[[etapas]]
id = "marcar"
nome = "Marcar reunião de apresentação"
tipo = "tarefa"
raia = "Júlia"
sistema = "Google Agenda [hipótese]"

[[etapas]]
id = "proposta"
nome = "Preparar a proposta"
tipo = "tarefa"
raia = "Júlia"
sistema = "Canva"

[[etapas]]
id = "reuniao"
nome = "Fazer a reunião e enviar a proposta"
tipo = "tarefa"
raia = "Thamires"

[[etapas]]
id = "fechou"
nome = "Cliente fechou?"
tipo = "decisao"
raia = "Cliente"
proximo = ["dados", "fim_nao"]
rotulos = { dados = "sim", fim_nao = "não" }

[[etapas]]
id = "dados"
nome = "Enviar os dados para o contrato e reforçar os serviços"
tipo = "tarefa"
raia = "Júlia"

[[etapas]]
id = "grupo"
nome = "Criar o grupo com o cliente"
tipo = "tarefa"
raia = "Júlia"
sistema = "WhatsApp / Nestzap"

[[etapas]]
id = "pasta"
nome = "Abrir a pasta do cliente e salvar a documentação"
tipo = "tarefa"
raia = "Júlia"
sistema = "OneDrive"

[[etapas]]
id = "falta"
nome = "Falta algum documento?"
tipo = "decisao"
raia = "Júlia"
proximo = ["pedir", "financeiro"]
rotulos = { pedir = "sim", financeiro = "não" }

[[etapas]]
id = "pedir"
nome = "Pedir o que falta [hipótese: canal não informado]"
tipo = "tarefa"
raia = "Cliente"
proximo = ["pasta"]

[[etapas]]
id = "financeiro"
nome = "É cliente do financeiro?"
tipo = "decisao"
raia = "Júlia"
proximo = ["fin_setup", "trello"]
rotulos = { fin_setup = "sim", trello = "não" }

[[etapas]]
id = "fin_setup"
nome = "Abrir planilha, criar no Trello e abrir o Conta Azul"
tipo = "tarefa"
raia = "Júlia"
sistema = "Planilha, Trello, Conta Azul"

[[etapas]]
id = "trello"
nome = "Criar a tarefa no Trello por responsável"
tipo = "tarefa"
raia = "Júlia"
sistema = "Trello"
proximo = ["fim"]

[[etapas]]
id = "fim_nao"
nome = "Não fechou"
tipo = "fim"
raia = "Cliente"

[[etapas]]
id = "fim"
nome = "Cliente implantado"
tipo = "fim"
raia = "Júlia"
